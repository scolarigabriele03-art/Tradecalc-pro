
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeCalc Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080c12;color:#e8eef6;font:16px Arial,sans-serif;padding:20px}
header{padding:15px 0;border-bottom:1px solid #263344;margin-bottom:24px}
h1{color:#35d49a;margin:0}
p{color:#91a0b4}
.card{background:#101720;border:1px solid #263344;border-radius:14px;padding:20px;margin:16px 0}
label{display:block;margin:14px 0 6px;color:#b8c5d8}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #354458;background:#080c12;color:white;font-size:16px}
button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:8px;background:#35d49a;color:#06140f;font-weight:bold;font-size:16px}
.result{font-size:20px;color:#35d49a;font-weight:bold;margin-top:16px}
</style>
</head>
<body>
<header>
<h1>TradeCalc Pro</h1>
<p>Trading calculators · Strumenti per trader</p>
</header>

<div class="card">
<h2>Calcolatore rischio</h2>
<p>Calcola quanto rischiare in base al capitale e alla percentuale scelta.</p>
<label>Capitale (€)</label>
<input id="capitale" type="number" value="1000" min="0">
<label>Rischio per operazione (%)</label>
<input id="rischio" type="number" value="1" min="0" max="100" step="0.1">
<button onclick="calcolaRischio()">Calcola rischio</button>
<div class="result" id="risultatoRischio">Rischio: €10,00</div>
</div>

<div class="card">
<h2>Calcolatore rapporto rischio/rendimento</h2>
<label>Prezzo di entrata (€)</label>
<input id="entrata" type="number" value="100" step="any">
<label>Stop loss (€)</label>
<input id="stop" type="number" value="95" step="any">
<label>Take profit (€)</label>
<input id="target" type="number" value="115" step="any">
<button onclick="calcolaRR()">Calcola rapporto R/R</button>
<div class="result" id="risultatoRR">Rapporto R/R: 3,00</div>
</div>

<div class="card">
<h2>Calcolatore profitto e perdita</h2>
<label>Prezzo di entrata (€)</label>
<input id="prezzoEntrata" type="number" value="100" step="any">
<label>Prezzo di uscita (€)</label>
<input id="prezzoUscita" type="number" value="110" step="any">
<label>Quantità acquistata</label>
<input id="quantita" type="number" value="1" min="0" step="any">
<button onclick="calcolaProfitto()">Calcola P/L</button>
<div class="result" id="risultatoPL">Profitto/perdita: €10,00</div>
</div>

<script>
function euro(n){
 return n.toLocaleString('it-IT',{
  style:'currency',currency:'EUR'
 });
}
function valore(id){
 return Number(document.getElementById(id).value);
}
function calcolaRischio(){
 const c=valore('capitale');
 const r=valore('rischio');
 document.getElementById('risultatoRischio').textContent=
 'Rischio: '+euro(c*r/100);
}
function calcolaRR(){
 const e=valore('entrata');
 const s=valore('stop');
 const t=valore('target');
 const rischio=Math.abs(e-s);
 const rendimento=Math.abs(t-e);
 document.getElementById('risultatoRR').textContent=
 rischio===0?'Inserisci uno stop diverso dall’entrata':
 'Rapporto R/R: '+(rendimento/rischio).toFixed(2);
}
function calcolaProfitto(){
 const e=valore('prezzoEntrata');
 const u=valore('prezzoUscita');
 const q=valore('quantita');
 const pl=(u-e)*q;
 document.getElementById('risultatoPL').textContent=
 'Profitto/perdita: '+euro(pl);
 document.getElementById('risultatoPL').style.color=
 pl>=0?'#35d49a':'#ff6b7a';
}
calcolaRischio();
calcolaRR();
calcolaProfitto();
</script>
</body>
</html>
